{% extends 'base.html' %}
{% load static %}

{% block title %}{{ object.name }}{% endblock %}
{% block content %}
    <b>{{ object.name }}</b>
    <ul>
        {% for ingredient in object.ingredient.all %}
            <li>{{ object.ingredient.name }} - {{ object.quantity }}</li>  
        {% endfor %}
    </ul>
{% endblock %}
