{% extends 'base.html' %}
{% load static %}

{% block title %}{{ recipe.name }}{% endblock %}
{% block content %}
    <b>{{ recipe.name }}</b>
    <ul>
        {% for ingredient in recipe.ingredient.all %}
            <li>{{ ingredient.ingredient.name }} - {{ ingredient.quantity }}</li>  
        {% endfor %}
    </ul>
{% endblock %}
