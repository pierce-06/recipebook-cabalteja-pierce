{% extends 'base.html' %}

{% block title %} Add recipe {% endblock %}
{% block header %}{% endblock %}
{% block content %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Submit">
    </form>
    <p><a href="{{ recipe.get_absolute_url }}">Go back to recipe</a></p>
{% endblock %}
