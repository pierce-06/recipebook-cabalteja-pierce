{% extends 'base.html' %}
{% load static %}

{% block title %}Recipes List{% endblock %}
{% block page_heading %}Recipes List{% endblock %}
{% block content %}
<ul>
    {% for recipe in recipes %}
    <li><a href='{{ recipe.get_absolute_url }}'>{{ recipe.name }}</a></li>
    {% endfor %}
</ul>
{% endblock %}
