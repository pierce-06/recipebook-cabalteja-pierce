<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}{% endblock %}</title>
</head>

<body>
    {% block header %}
        <h1>Recipe Book</h1>
    {% if user.is_authenticated %}
        <h3>Hello {{ user.username }}</h3>
        {% include 'registration/logout.html' %}
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
    {% endblock %}
    <h2></h2>
    <div id="content">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
